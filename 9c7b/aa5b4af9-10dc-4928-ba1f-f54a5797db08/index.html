<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      padding: 2rem;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }

    .line {
      width: 80px;
      height: 3px;
      margin: 0 auto;
      background: #38bdf8;
      border-radius: 999px;
    }

    footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Coming Soon</h1>
    <p>
      このサイトは現在準備中です。<br>
      また後ほどお越しください。
    </p>
    <div class="line"></div>
  </main>

  <footer>
    © 2026 yourika
  </footer>
</body>
</html>
