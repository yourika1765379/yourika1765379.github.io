<!DOCTYPE html>
<html lang="ja" class="scrollbar-gutter-stable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>

<body>
  <div id="bg"></div>

  <header>
    <h1>1/root書架</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <details class="library-menu">
        <summary>Library</summary>
        <div class="submenu">
          <a href="9c7b/index.html">沙羅双樹の花<span>荼毘ホー</span></a>
          <a href="#">すこしあかりて(閉鎖中)<span>常ホー、常闇夢</span></a>
          <a href="#">いづれの御時に(閉鎖中)<span>アイナナ</span></a>
        </div>
      </details>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contact</h2>

      <div class="section-content">
        <p>
          本の感想、サイトの不具合報告などはこちらから。
        </p>
        <p style="text-align: center;">
          ✦ ✧ ✦
        </p>
      </div>

      <form id="contactForm">
        <!-- 質問1 -->
        <section>
          <h3>お問い合わせ内容</h3>
          <label>
            <input type="radio" name="category"
            value="作品についての感想・誤字報告" required>
            作品についての感想・誤字報告
          </label>
          <label>
            <input type="radio" name="category"
            value="サイトの不具合・バグ報告">
            サイトの不具合・バグ報告
          </label>
          <div class="other-option">
            <label>
              <input type="radio" name="category"
              value="その他">
              その他：
            </label>
            <input type="text" id="otherText" name="otherText" disabled>
          </div>
        </section>

        <!-- 質問2・3 -->
        <section id="bookSection" hidden>
          <h3>本を選択</h3>
          <div class="selectbox-5">
            <select id="bookSelect" name="book">
              <option value="" selected disabled>タイトルを選択してください</option>
            </select>
          </div>

          <h3>感想・誤字報告</h3>
          <textarea id="bookMessage" name="bookMessage"></textarea>
        </section>

        <!-- 質問4・5 -->
        <section id="bugSection" hidden>
          <h3>該当ページ選択</h3>
          <div id="pageOptions"></div>

          <h3>不具合の内容</h3>
          <textarea id="bugMessage" name="bugMessage"></textarea>
        </section>

        <!-- 質問6 -->
        <section id="otherDetail" hidden>
          <h3>その他</h3>
          <textarea id="otherDetailMessage" name="otherDetailMessage" disabled></textarea>
        </section>

        <button id="submitButton" class="btn-seal" type="submit" hidden disabled>送信</button>
      </form>
      <p id="status" aria-live="polite"></p>

      <!-- Googleフォーム送信用 -->
      <iframe name="googleFormFrame" id="googleFormFrame" hidden></iframe>
    </section>
  </main>

  <footer>
    © 2026 yourika
  </footer>

  <script src="js/common.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
