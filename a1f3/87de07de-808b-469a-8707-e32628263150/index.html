<script>
const track = document.getElementById("slideTrack");
const slides = track.querySelectorAll(".slide");

const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const pageNumber = document.getElementById("pageNumber");

let currentIndex = 0;
let isAnimating = false;

function updateButtons() {
  prevButton.disabled = currentIndex === 0;
  nextButton.disabled = currentIndex === slides.length - 1;

  pageNumber.textContent =
    `${currentIndex + 1} / ${slides.length}`;
}

function moveSlide(direction) {
  if (isAnimating) return;

  const nextIndex = currentIndex + direction;

  if (nextIndex < 0 || nextIndex >= slides.length) return;

  isAnimating = true;
  currentIndex = nextIndex;

  const slideWidth = slides[0].getBoundingClientRect().width;

  track.style.transform =
    `translateX(-${slideWidth * currentIndex}px)`;

  updateButtons();
}

track.addEventListener("transitionend", () => {
  isAnimating = false;
});

prevButton.addEventListener("click", () => {
  moveSlide(-1);
});

nextButton.addEventListener("click", () => {
  moveSlide(1);
});

updateButtons();
</script>

  <img
    id="little-dabiho-walk"
    src="../image/little-dabiho-walk.GIF"
    alt=""
    aria-hidden="true"
    style="position: absolute; left: 0; top: 0; width: 88px; max-width: 20vw; max-height: 16vh; object-fit: contain; z-index: 999; pointer-events: none; visibility: hidden;"
  >
  <script>
    const littleDabiho = document.getElementById("little-dabiho-walk");
    function placeLittleDabiho() {
      const bounds = littleDabiho.getBoundingClientRect();
      const maxLeft = Math.max(0, window.innerWidth - bounds.width);
      const maxTop = Math.max(0, window.innerHeight - bounds.height);
      littleDabiho.style.left = `${window.scrollX + Math.random() * maxLeft}px`;
      littleDabiho.style.top = `${window.scrollY + Math.random() * maxTop}px`;
      littleDabiho.style.visibility = "visible";
    }
    if (littleDabiho.complete) {
      placeLittleDabiho();
    } else {
      littleDabiho.addEventListener("load", placeLittleDabiho, { once: true });
    }
  </script>
